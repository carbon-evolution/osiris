version: 2
updates:
  # Keeps SHA-pinned workflow actions (and their "# vX.Y.Z" comments) current.
  # npm security updates are enabled in repo settings and need no entry here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Base images are pinned by digest in the Dockerfiles; this keeps them current.
  - package-ecosystem: docker
    directories: ["/", "/intel"]
    schedule:
      interval: weekly
    # Node major upgrades are deliberate (CI node-version + both Dockerfiles
    # together, on an LTS line); only take digest/minor/patch updates here.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
