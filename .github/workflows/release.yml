name: release

# On a version tag:
#   container  - build, push and keyless-sign the image on GHCR (SBOM + provenance attached)
#   artifacts  - build the source archive, Next.js standalone bundle and npm SBOM;
#                write SHA256SUMS, keyless-sign every file (Sigstore bundles) and
#                attest SLSA v1 build provenance for them
#   release    - create the GitHub Release with all of the above as assets
# workflow_dispatch only runs the container job (no tag, so nothing to release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    # Write scopes only for the job that publishes and signs.
    permissions:
      contents: read
      packages: write
      id-token: write # keyless Sigstore signing via GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA build provenance and an SBOM, attached to the image as attestations.
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: the signature binds the image digest to this repo, workflow and
      # ref via GitHub's OIDC identity, recorded in the public Rekor log.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do images+="${tag}@${DIGEST} "; done
          # Word splitting of images is intended (one ref per tag).
          # shellcheck disable=SC2086
          cosign sign --yes ${images}
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Signature verified for ${IMAGE}@${DIGEST}"

  artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # keyless Sigstore signing of the release files
      attestations: write # store the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      # Source archive: git archive output is a pure function of the tagged
      # commit (mtimes = commit time) and gzip -n drops the name/timestamp, so
      # anyone can rebuild it byte for byte from the tag.
      # Standalone bundle: the layout from Next's standalone deployment docs
      # (.next/standalone + .next/static + public), runnable with `node server.js`,
      # tarred with sorted names, fixed mtimes and numeric root ownership.
      - name: Package release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct)"
          mkdir -p dist

          git archive --format=tar --prefix="osiris-${TAG}/" HEAD \
            | gzip -n -9 > "dist/osiris-${TAG}-source.tar.gz"

          stage_root="$(mktemp -d)"
          stage="${stage_root}/osiris-${TAG}"
          mkdir -p "${stage}/.next" "${stage}/public"
          cp -a .next/standalone/. "${stage}/"
          cp -a .next/static "${stage}/.next/static"
          cp -a public/. "${stage}/public/"
          tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            --format=posix --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
            -C "${stage_root}" -cf - "osiris-${TAG}" \
            | gzip -n -9 > "dist/osiris-${TAG}-standalone.tar.gz"

          # CycloneDX SBOM of the production npm dependency tree, generated by
          # npm itself (npm sbom) from the lockfile-installed node_modules.
          npm sbom --sbom-format=cyclonedx --omit=dev > "dist/osiris-${TAG}-sbom.cdx.json"

          (cd dist && sha256sum -- osiris-* > SHA256SUMS && cat SHA256SUMS)

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: each <file>.sigstore.json bundle holds the signature, the
      # short-lived Fulcio certificate (identity = this workflow at this tag)
      # and the Rekor transparency-log entry.
      - name: Sign release files
        run: |
          set -euo pipefail
          files=(dist/osiris-* dist/SHA256SUMS)
          for f in "${files[@]}"; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "${f}" > /dev/null
          done
          ls -l dist

      - name: Verify the signatures
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          for bundle in dist/*.sigstore.json; do
            f="${bundle%.sigstore.json}"
            cosign verify-blob "${f}" --bundle "${bundle}" \
              --certificate-identity "${IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      # SLSA v1 build provenance (in-toto statement, Sigstore-signed) for every
      # file listed in SHA256SUMS. It is stored in the repo's attestations
      # (`gh attestation verify <file> --repo ...`) and its bundle is also
      # shipped as osiris-<tag>.intoto.jsonl so it can be verified offline and
      # is recognised as provenance by OpenSSF Scorecard. A SHA-pinned action is
      # used instead of slsa-github-generator, whose reusable workflow can only
      # be pinned by tag (Scorecard counts that as an unpinned dependency).
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Add and verify the provenance
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          provenance="dist/osiris-${TAG}.intoto.jsonl"
          cp "${BUNDLE}" "${provenance}"
          for f in dist/osiris-*.tar.gz dist/osiris-*-sbom.cdx.json; do
            gh attestation verify "${f}" --repo "${REPO}" --bundle "${provenance}" \
              --signer-workflow "${REPO}/.github/workflows/release.yml" \
              --source-ref "refs/tags/${TAG}" --deny-self-hosted-runners
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 5

  release:
    needs: [container, artifacts]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release and upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      # No CHANGELOG in the repo, so the notes are GitHub's generated notes
      # with a verification preamble prepended.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          version="${TAG#v}"
          cat > notes.md <<EOF
          ## Verify this release

          Every file is signed keylessly with Sigstore (\`<file>.sigstore.json\`) by
          \`.github/workflows/release.yml\` at \`refs/tags/${TAG}\`, and covered by SLSA
          build provenance (\`osiris-${TAG}.intoto.jsonl\`). See
          [DOCKER.md](https://github.com/${REPO}/blob/${TAG}/DOCKER.md#4-verifying-a-release).

          \`\`\`bash
          sha256sum -c SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \\
            --certificate-identity 'https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${TAG}' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          gh attestation verify osiris-${TAG}-standalone.tar.gz --repo ${REPO} \\
            --bundle osiris-${TAG}.intoto.jsonl \\
            --signer-workflow ${REPO}/.github/workflows/release.yml --source-ref refs/tags/${TAG}
          \`\`\`

          Container image: \`ghcr.io/${REPO}:${version}\` (signed with cosign, SBOM + provenance attached).

          EOF
          if gh release view "${TAG}" --repo "${REPO}" > /dev/null 2>&1; then
            # Re-run of a tag whose release already exists: refresh the assets.
            gh release upload "${TAG}" dist/* --repo "${REPO}" --clobber
          else
            gh release create "${TAG}" dist/* --repo "${REPO}" --verify-tag \
              --title "${TAG}" --notes-file notes.md --generate-notes
          fi
